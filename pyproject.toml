[project]
name = "banca-multiple-indicadores"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]

[project.scripts]
bancos = "banca_multiple.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["banca_multiple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
